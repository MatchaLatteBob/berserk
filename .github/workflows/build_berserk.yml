name: Release Berserk AVX2

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag like v1.0, v15.0, etc.

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial permission allowing GitHub to create the release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang

      - name: Compile Berserk AVX2 (with PGO)
        run: |
          cd src
          make pgo CC=clang ARCH=avx2

      - name: Prepare Binary Asset
        run: |
          mkdir -p build
          # Rename the compiled binary to clearly mark it as AVX2
          mv src/berserk build/berserk-avx2-linux

      - name: Create GitHub Release and Upload Binary
        uses: softprops/action-gh-release@v2
        with:
          files: build/berserk-avx2-linux
          name: Berserk Release ${{ github.ref_name }}
          draft: false
          prerelease: false
