name: Compile & Release Berserk AVX2

on:
  workflow_dispatch: # This is the magic line that creates the clickable button!

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed so the action can create the release page

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang

      - name: Compile Berserk AVX2 (with PGO)
        run: |
          cd src
          make pgo CC=clang ARCH=avx2

      - name: Prepare Binary Asset
        run: |
          mkdir -p build
          mv src/berserk build/berserk-avx2-linux

      - name: Create Automatic Release & Upload Asset
        uses: softprops/action-gh-release@v3
        with:
          files: build/berserk-avx2-linux
          tag_name: click-build-${{ github.run_number }}
          name: Berserk AVX2 Manual Build #${{ github.run_number }}
          body: "This binary was compiled on demand via GitHub Actions manual trigger."
          draft: false
          prerelease: false
